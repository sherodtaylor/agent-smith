{{- /*
D3 spike — substrate crypto bootstrap Job.

Substrate's control plane (ate-api-server, atenet-router, valkey-cluster)
mounts 5 credential Secrets that don't exist by default and can't be
generated by helm — CA-pool + JWT-pool material requires substrate's own
`kubectl-ate admin make-{ca,jwt}-pool` CLI (the pool objects encode
substrate-specific JSON schema wrapping DER certs).

This Job runs as a Helm pre-install/pre-upgrade hook so it fires BEFORE
ate-api-server + valkey Deployments start Waiting on those Secret mounts.
It:

  1. Builds kubectl-ate from source at the pinned SUBSTRATE_SHA.
  2. Runs the 4 `kubectl-ate admin make-*-pool` invocations (from
     substrate's own hack/install-ate.sh, functions
     create_{jwt_authority,session_id_ca,podcertificate_controller_cas}_pool_secret).
  3. Extracts the two podcert CA-pool root PEMs, concats them into the
     `valkey-ca-certs` Secret (substrate's ca_pool_root_pem helper).
  4. Creates the ate-api-server-envvars ConfigMap (create_api_server_env_vars).
  5. Every step is idempotent: `get` first, `make-*` only if 404 — safe to
     re-run on chart upgrade.

Filed upstream as gap **U6** in the agent-substrate eval PRD gap list.

RBAC is scoped tight: SecretRules in ate-system + podcertificate-
controller-system + ConfigMap in ate-system. No cluster-admin, no wildcards.
*/ -}}
{{- if and (default false .Values.actor.enabled) (eq (default "bring-your-own" .Values.actor.installMode) "helm-native") }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-substrate-bootstrap
  namespace: ate-system
  labels:
    {{- include "agent-smith.labels" . | nindent 4 }}
    app.kubernetes.io/component: substrate-bootstrap
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
---
# Cluster-scoped Role (NOT cluster-admin). We can't scope Role to a single
# namespace because bootstrap works across ate-system + podcertificate-
# controller-system (podcert ns may not exist yet on first install — pre-
# install hook fires before main templates including the namespace resource).
# Perms are tight: Secrets + ConfigMaps + Namespaces only (needed to `kubectl
# create ns podcertificate-controller-system --dry-run=client | apply -f -`
# per the same idempotent pattern upstream uses).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-substrate-bootstrap
  labels:
    {{- include "agent-smith.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-substrate-bootstrap
  labels:
    {{- include "agent-smith.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-substrate-bootstrap
    namespace: ate-system
roleRef:
  kind: ClusterRole
  name: {{ .Release.Name }}-substrate-bootstrap
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-substrate-bootstrap
  namespace: ate-system
  labels:
    {{- include "agent-smith.labels" . | nindent 4 }}
    app.kubernetes.io/component: substrate-bootstrap
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/component: substrate-bootstrap
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ .Release.Name }}-substrate-bootstrap
      containers:
        - name: bootstrap
          image: "golang:1.25-bookworm"
          env:
            - name: SUBSTRATE_SHA
              value: {{ .Values.actor.substrateFullSHA | quote }}
            - name: HOME
              value: /root
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail

              echo "==> installing kubectl + openssl"
              apt-get update -qq >/dev/null
              apt-get install -y -qq curl openssl >/dev/null

              KUBECTL_VERSION=$(curl -sL https://dl.k8s.io/release/stable.txt)
              curl -sfLo /usr/local/bin/kubectl \
                "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
              chmod +x /usr/local/bin/kubectl

              # Ensure both namespaces exist (main install templates create
              # them, but pre-install hook fires first).
              for ns in ate-system podcertificate-controller-system; do
                kubectl create namespace "${ns}" --dry-run=client -o yaml | kubectl apply -f -
              done

              echo "==> cloning substrate @ ${SUBSTRATE_SHA}"
              git clone --quiet https://github.com/agent-substrate/substrate /src
              cd /src && git -c advice.detachedHead=false checkout "${SUBSTRATE_SHA}"

              echo "==> building kubectl-ate"
              go install ./cmd/kubectl-ate
              export PATH="${HOME}/go/bin:${PATH}"

              # ---------------------------------------------------------------
              # Idempotent Secret creation. Same pattern as upstream
              # ensure_apiserver_prerequisites — `get` first, `make-*` only if 404.
              # ---------------------------------------------------------------

              echo "==> ensuring session-id-jwt-pool (ate-system)"
              kubectl get secret -n ate-system session-id-jwt-pool >/dev/null 2>&1 || \
                kubectl-ate admin make-jwt-pool \
                  --key-id="1" \
                  --name="session-id-jwt-pool" \
                  --secret-namespace=ate-system

              echo "==> ensuring session-id-ca-pool (ate-system)"
              kubectl get secret -n ate-system session-id-ca-pool >/dev/null 2>&1 || \
                kubectl-ate admin make-ca-pool \
                  --ca-id="1" \
                  --name="session-id-ca-pool" \
                  --secret-namespace=ate-system

              echo "==> ensuring service-dns-ca-pool (podcertificate-controller-system)"
              kubectl get secret -n podcertificate-controller-system service-dns-ca-pool >/dev/null 2>&1 || \
                kubectl-ate admin make-ca-pool \
                  --ca-id="1" \
                  --name="service-dns-ca-pool" \
                  --secret-namespace=podcertificate-controller-system

              echo "==> ensuring pod-identity-ca-pool (podcertificate-controller-system)"
              kubectl get secret -n podcertificate-controller-system pod-identity-ca-pool >/dev/null 2>&1 || \
                kubectl-ate admin make-ca-pool \
                  --ca-id="1" \
                  --name="pod-identity-ca-pool" \
                  --secret-namespace=podcertificate-controller-system

              # ---------------------------------------------------------------
              # valkey-ca-certs: concat the two CA-pool root PEMs so valkey can
              # verify both server certs (servicedns CA) and client certs
              # (podidentity CA). Mirrors upstream ca_pool_root_pem +
              # create_valkey_ca_certs_secret.
              # ---------------------------------------------------------------

              ca_pool_root_pem() {
                local secret="$1"
                local pool_json
                pool_json=$(kubectl get secret -n podcertificate-controller-system "${secret}" \
                            -o jsonpath='{.data.pool}' | base64 --decode)
                local der_base64
                der_base64=$(echo "${pool_json}" | grep -o '"RootCertificateDER":"[^"]*' \
                              | sed 's/"RootCertificateDER":"//')
                echo "${der_base64}" | base64 --decode | openssl x509 -inform der -outform pem
              }

              echo "==> ensuring valkey-ca-certs (ate-system)"
              if ! kubectl get secret -n ate-system valkey-ca-certs >/dev/null 2>&1; then
                servicedns_root=$(ca_pool_root_pem service-dns-ca-pool)
                podidentity_root=$(ca_pool_root_pem pod-identity-ca-pool)
                if [[ -z "${servicedns_root}" || -z "${podidentity_root}" ]]; then
                  echo "error: failed to extract a CA root for valkey-ca-certs" >&2
                  exit 1
                fi
                ca_certs=$(printf '%s\n%s\n' "${servicedns_root}" "${podidentity_root}")
                kubectl create secret generic valkey-ca-certs \
                  --namespace=ate-system \
                  --from-literal=tls-ca-cert-file="${ca_certs}"
              fi

              # ---------------------------------------------------------------
              # ate-api-server-envvars ConfigMap. Substrate's install-ate.sh
              # create_api_server_env_vars() builds this — for the spike we
              # ship the vanilla self-hosted flavor (valkey address, no IAM
              # auth, no external redis TLS server name).
              # ---------------------------------------------------------------

              echo "==> ensuring ate-api-server-envvars ConfigMap (ate-system)"
              kubectl create configmap ate-api-server-envvars \
                --namespace=ate-system \
                --from-literal=REDIS_ADDRESS="valkey-cluster.ate-system.svc:6379" \
                --from-literal=REDIS_USE_IAM_AUTH="false" \
                --from-literal=REDIS_TLS_SERVER_NAME="" \
                --dry-run=client -o yaml | kubectl apply -f -

              echo "==> bootstrap complete"
{{- end }}
