{{- /*
Agent Substrate ActorTemplate — one per persona with runtime=actor.

The harness container is the same agent-smith image as deployment mode.
Per-agent env — typically MATRIX_ACCESS_TOKEN, optionally ANTHROPIC_API_KEY —
arrives as plain literals via actor.agentEnv.<name>; populate that map
via Flux valuesFrom (Secret → targetPath) at deploy time and never
commit real values. The ActorTemplate CRD supports neither secret volume
mounts nor envFrom, and secretKeyRef won't fire until upstream
agent-substrate/substrate#835 lands, so plain-env-via-values is the only
working path today. Long-term convergence is HTTPS_PROXY once #835 +
ext_proc arrive.

Do NOT put the deployment-mode iron-proxy stubs
(GITHUB_TOKEN=proxy-token-github, NODE_EXTRA_CA_CERTS=/root/iron-proxy.crt)
into agentEnv: actor egress bypasses iron-proxy (sandbox nftables →
atunnel → atenet-egress), so the stubs would reach the real endpoint
unswapped and 401. Real GitHub access from actor mode is deferred until
the HTTPS_PROXY convergence path lands.

iron-proxy sidecar removed: image was not digest-pinned (rc14 CRD
requires "@" pin) and the sidecar's own token could not be delivered
either, so the container never worked in this mode. If/when we come
back to sandbox egress control, atenet's HTTPForward is the path.

Persona ConfigMap: intentionally NOT mounted. In actor mode the persona
is baked into the golden snapshot at ActorTemplate apply time; changing
the persona means creating a new ActorTemplate (immutable).

durableDir carries ~/.claude + workspace state across suspend/resume so
per-actor progress survives being suspended.

Spec surface reference: docs/superpowers/specs/2026-07-29-agent-substrate-actor-mode-design.md.
*/ -}}
{{- $root := . -}}
{{- $agents := fromJsonArray (include "agent-smith.agentList" .) -}}
{{- range $agent := $agents }}
{{- if eq (include "agent-smith.runtimeFor" (dict "agent" $agent "Values" $root.Values)) "actor" }}
---
apiVersion: ate.dev/v1alpha1
kind: ActorTemplate
metadata:
  name: {{ $agent.name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "agent-smith.labels" $root | nindent 4 }}
    app.kubernetes.io/component: agent
    agent-smith.io/agent: {{ $agent.name }}
spec:
  sandboxClass: {{ $root.Values.actor.workerPool.sandboxClass | quote }}
  workerSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $root.Release.Name }}
  snapshotsConfig:
    location: {{ printf "s3://%s/%s/%s/" $root.Values.actor.snapshotStore.bucket $root.Release.Name $agent.name | quote }}
  containers:
    - name: agent
      image: "{{ $root.Values.image.repository }}@{{ include "agent-smith.agentImageTag" (dict "agent" $agent "Values" $root.Values "Chart" $root.Chart) }}"
      env:
        - name: AGENT_NAME
          value: {{ $agent.name | quote }}
        - name: HOME
          value: /root
        - name: IS_SANDBOX
          value: "true"
        {{- /* Matrix non-secret env — parity with statefulset's agent
              container so claude-reauth's matrixDM() and the plugin's
              runtime config both work. The token itself arrives via
              actor.agentEnv below. */ -}}
        {{- $homeserverUrl := default (default "" $root.Values.matrix.homeserverUrl) $agent.matrix.homeserverUrl }}
        {{- if $homeserverUrl }}
        - name: MATRIX_HOMESERVER_URL
          value: {{ $homeserverUrl | quote }}
        {{- end }}
        - name: MATRIX_BOT_USER_ID
          value: {{ $agent.matrix.botUserId | quote }}
        {{- if $agent.matrix.allowedUsers }}
        - name: MATRIX_ALLOWED_USERS
          value: {{ $agent.matrix.allowedUsers | quote }}
        {{- end }}
        {{- if $root.Values.quietHours.window }}
        - name: QUIET_HOURS
          value: {{ $root.Values.quietHours.window | quote }}
        - name: QUIET_HOURS_TZ
          value: {{ $root.Values.quietHours.tz | quote }}
        {{- end }}
        {{- /* Fleet-wide extraEnv is deliberately NOT rendered here.
              The homelab's shared-values.yaml puts the iron-proxy stubs
              (GITHUB_TOKEN=proxy-token-github, NODE_EXTRA_CA_CERTS) into
              extraEnv for deployment-mode agents; those stubs are
              pointless in actor mode because sandbox egress bypasses
              iron-proxy entirely (nftables → atunnel → atenet-egress).
              Anything an actor legitimately needs goes through
              actor.agentEnv.<name> instead. */ -}}
        {{- /* Per-agent env from actor.agentEnv.<name>. Rendered last so
              per-agent values (typically MATRIX_ACCESS_TOKEN, fed by
              Flux valuesFrom targetPath) win any collision. */ -}}
        {{- range $k, $v := (get ($root.Values.actor.agentEnv | default dict) $agent.name) }}
        - name: {{ $k }}
          value: {{ $v | quote }}
        {{- end }}
      {{- if $root.Values.actor.readyz.enabled }}
      readyz:
        httpGet:
          path: {{ $root.Values.actor.readyz.path | quote }}
          port: {{ $root.Values.actor.readyz.port }}
      {{- end }}
      volumeMounts:
        - name: agent-state
          mountPath: /root
  volumes:
    - name: agent-state
      durableDir:
        size: {{ $root.Values.persistence.home.size | quote }}
{{- end }}
{{- end }}
