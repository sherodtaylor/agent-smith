{{- /*
Agent Substrate ActorTemplate — one per persona with runtime=actor.

The harness container is the same agent-smith image as deployment mode.
Per-agent env — typically MATRIX_ACCESS_TOKEN, optionally ANTHROPIC_API_KEY —
arrives as plain literals via actor.agentEnv.<name>; populate that map
via Flux valuesFrom (Secret → targetPath) at deploy time and never
commit real values. The ActorTemplate CRD supports neither secret volume
mounts nor envFrom, and secretKeyRef won't fire until upstream
agent-substrate/substrate#835 lands, so plain-env-via-values is the only
working path today. Long-term convergence is HTTPS_PROXY once #835 +
ext_proc arrive.

Do NOT put the deployment-mode iron-proxy stubs
(GITHUB_TOKEN=proxy-token-github, NODE_EXTRA_CA_CERTS=/root/iron-proxy.crt)
into agentEnv: actor egress bypasses iron-proxy (sandbox nftables →
atunnel → atenet-egress), so the stubs would reach the real endpoint
unswapped and 401. Real GitHub access from actor mode is deferred until
the HTTPS_PROXY convergence path lands.

iron-proxy sidecar removed: image was not digest-pinned (rc14 CRD
requires "@" pin) and the sidecar's own token could not be delivered
either, so the container never worked in this mode. If/when we come
back to sandbox egress control, atenet's HTTPForward is the path.

Persona ConfigMap: intentionally NOT mounted. In actor mode the persona
is baked into the golden snapshot at ActorTemplate apply time; changing
the persona means creating a new ActorTemplate (immutable).

durableDir carries ~/.claude + workspace state across suspend/resume so
per-actor progress survives being suspended.

Metadata.name carries a spec hash suffix: `<agent>-<hash8>`. The CRD
rejects any in-place spec change, so drift (token rotation, image bump,
env change, snapshots move) has to yield a new resource. Hashing the
rendered spec makes that automatic — helm creates the new template and
prunes the old on a successful upgrade. On a failed health-wait both
briefly coexist (harmless — the old one carries a stale token anyway).
The stable `agent-smith.io/agent: <name>` label lets selectors follow
the persona across hash bumps.

snapshotsConfig.location is deliberately keyed on `<release>/<agent>/`
with NO hash in the path — the snapshot prefix survives any template
rename. Rename triggers a fresh BAKE (RunWorkload) on the substrate
controller path, which has NO router deadline; the ~6s ceiling that
R5 gate 2 addresses only guards ingress-triggered RESUMEs
(atelet.AteomHerder/Restore). So rotation cost under hash-suffix
naming is `persona restart + ~75s rebake` — the same order as a
deployment-mode secret-rotation restart, and strictly safer than the
immutable-spec brick this pattern removes. Confirmed against today's
log evidence: RunWorkload never failed once, only Restore did
(pmbot/infrabot cross-checked 2026-09-19). Gate 3 (this template)
closes independent of gate 2. Two verify-at-re-flip items live on
pmbot's list, not blocking the tag: (a) confirm rename→rebake vs
attempted restore-from-old-snapshot, and (b) snapshot GC — every
rebake writes a new UUID under the agent prefix, so orphans
accumulate at fleet × rotation-cadence scale (added to R6 gate 4).

Spec surface reference: docs/superpowers/specs/2026-07-29-agent-substrate-actor-mode-design.md.
*/ -}}
{{- $root := . -}}
{{- $agents := fromJsonArray (include "agent-smith.agentList" .) -}}
{{- range $agent := $agents }}
{{- if eq (include "agent-smith.runtimeFor" (dict "agent" $agent "Values" $root.Values)) "actor" }}
{{- /* Actor image ref format is `<repo>@<tag>` per rc14 CRD's CEL rule
      requiring "@" in the image string; the substrate accepts only
      digest refs there, not floating tags. Fail render early with a
      message that names the fix so operators don't discover this from
      an obscure CRD admission error at Flux-apply time. */ -}}
{{- $imageTag := include "agent-smith.agentImageTag" (dict "agent" $agent "Values" $root.Values "Chart" $root.Chart) -}}
{{- if not (hasPrefix "sha256:" $imageTag) -}}
{{- fail (printf "agents[%s].image.tag must be a digest (\"sha256:...\") for runtime: actor; got %q — set per-agent image.tag to the resolved digest of the release image (or set the fleet-wide image.tag) so `%s@<tag>` is a valid digest ref" $agent.name $imageTag $root.Values.image.repository) -}}
{{- end -}}
{{- $spec := include "agent-smith.actorTemplateSpec" (dict "agent" $agent "root" $root) -}}
{{- $hash := $spec | sha256sum | trunc 8 -}}
---
apiVersion: ate.dev/v1alpha1
kind: ActorTemplate
metadata:
  name: {{ $agent.name }}-{{ $hash }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "agent-smith.labels" $root | nindent 4 }}
    app.kubernetes.io/component: agent
    agent-smith.io/agent: {{ $agent.name }}
spec:
  {{- $spec | nindent 2 }}
{{- end }}
{{- end }}
