{{- /*
D2 spike — substrate install-by-Job.

When actor.enabled=true AND actor.installMode=job, chart emits:
  - system-upgrade-scope SA + ClusterRoleBinding to cluster-admin (substrate
    install touches CRDs across the cluster; scoped SA + TTL protects it)
  - ConfigMap with the substrate manifests, image refs already pointing at
    the pinned CI-published tags (ghcr.io/sherodtaylor/substrate/<binary>:sha-<8char>)
  - Job that runs `kubectl apply -f /manifests/` once, then TTLs out in 1h

D2 tradeoffs vs D1/D3 documented in
docs/superpowers/specs/2026-07-30-d2-installer-job-spike.md.
*/ -}}
{{- if and (default false .Values.actor.enabled) (eq (default "bring-your-own" .Values.actor.installMode) "job") }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-substrate-installer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-smith.labels" . | nindent 4 }}
    app.kubernetes.io/component: substrate-installer
---
# Scoped for the substrate install surface: CRDs, ClusterRoles/Bindings,
# Deployments/DaemonSets/Services across ate-system + kube-system (podcert-
# controller lives there). cluster-admin is the honest scope — substrate
# touches too many verbs/groups to enumerate.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-substrate-installer
  labels:
    {{- include "agent-smith.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-substrate-installer
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-substrate-manifests
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-smith.labels" . | nindent 4 }}
data:
  # SPIKE PLACEHOLDER — full manifest set follows on Phase 2.
  # For the spike, ship a minimal test resource to verify the Job's apply
  # path works end-to-end. The real content is the vendored + patched
  # substrate manifest tree (ate-system-namespace, ate-api-server,
  # ate-controller, atelet, atenet-{dns,router}, pod-certificate-
  # controller, sandboxconfig-gvisor), with `image: ko://...` refs
  # replaced by ghcr.io/sherodtaylor/substrate/<binary>:{{ .Values.actor.installMode | quote }}
  ate-system-namespace.yaml: |
    apiVersion: v1
    kind: Namespace
    metadata:
      name: ate-system
      labels:
        substrate.ate.dev/managed: "true"
        installed-by: agent-smith-substrate-installer-{{ .Release.Name }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-substrate-install
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-smith.labels" . | nindent 4 }}
    app.kubernetes.io/component: substrate-installer
  annotations:
    # Re-run on chart install/upgrade; hook-delete-policy clears the previous
    # Job so a fresh one lands (e.g. after a SUBSTRATE_SHA / substrateImageTag
    # bump). Full-manifest checksum will follow when we vendor real manifests
    # into the ConfigMap; the spike ships the plumbing without it.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: substrate-installer
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ .Release.Name }}-substrate-installer
      containers:
        - name: installer
          image: bitnami/kubectl:1.36.1
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              echo "==> agent-smith substrate installer ({{ .Release.Name }})"
              echo "==> substrate image tag: {{ .Values.actor.substrateImageTag | default "sha-46adcb80" }}"
              echo "==> applying vendored substrate manifests"
              kubectl apply -f /manifests/
              echo "==> waiting for ate-system namespace"
              kubectl wait --for=condition=Ready --timeout=60s ns/ate-system 2>/dev/null || true
              echo "==> installer done"
          volumeMounts:
            - name: manifests
              mountPath: /manifests
              readOnly: true
      volumes:
        - name: manifests
          configMap:
            name: {{ .Release.Name }}-substrate-manifests
{{- end }}
