# agent-smith chart values (v0.2.0+)
#
# Declare one entry per agent under `agents`. Each entry is self-contained:
# name, secret reference, matrix bot identity, repos to clone, plus optional
# per-agent overrides for image.tag (canary rolls) and configMapRef (persona
# pinning). All other fields below the array are fleet-wide defaults applied
# to every agent.
#
# Legacy single-agent shape (top-level `agentName: foo` + sibling fields) is
# still accepted during the v0.2.x/v0.3.x deprecation window; see _helpers.tpl
# `agent-smith.agentList`.

agents: []
# Example:
# agents:
#   - name: infrabot
#     existingSecret: infrabot-secrets
#     # Optional per-agent overrides (default to top-level when unset):
#     # configMapRef: infrabot-persona-v3   # mount this CM as persona
#     # image:                              # canary image
#     #   tag: v0.2.1
#     matrix:
#       botUserId: "@infrabot:lab.sherodtaylor.dev"
#       allowedUsers: "@sherod:lab.sherodtaylor.dev,@devbot:..."
#     agentRepos: [sherodtaylor/homelab]
#     primaryRepo: homelab
#     # runtime: deployment (default) | actor
#     # Set to `actor` to opt this persona into agent-substrate actor mode.
#     # Requires `actor.enabled: true` at fleet level (see below). Personas
#     # without `runtime: actor` continue to render as StatefulSets even when
#     # actor mode is enabled — the two modes coexist in the same release.
#     # See docs/superpowers/specs/2026-07-29-agent-substrate-actor-mode-design.md.
#     runtime: actor

image:
  repository: ghcr.io/sherodtaylor/agent-smith
  tag: ""              # defaults to Chart.AppVersion when empty
  pullPolicy: IfNotPresent

# Matrix homeserver shared across every agent in the fleet. Per-agent
# botUserId / allowedUsers live under agents[].matrix; the homeserver URL
# is fleet-wide unless a specific agent overrides via agents[].matrix.homeserverUrl.
matrix:
  homeserverUrl: ""

# iron-proxy egress credential firewall integration. When enabled the pod's
# dnsPolicy points at iron-proxy so HTTPS egress is intercepted and real
# tokens are swapped at the edge.
ironProxy:
  enabled: true
  clusterIp: 10.43.100.100

persistence:
  home:
    enabled: true
    size: 10Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  workspace:
    enabled: true
    size: 20Gi
    storageClass: ""
    accessMode: ReadWriteOnce

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 4Gi

# Per-agent ServiceAccount creation. The chart fans out one SA per agent
# entry (named after `agents[i].name`). Set `create: false` when an
# external system (homelab Kustomize, sealed-secrets, GitOps repo) already
# manages the per-agent ServiceAccounts and you want the chart to use
# them by reference without trying to own them. Default `true` for
# stand-alone installs.
serviceAccount:
  create: true

# Cluster-scoped RBAC. The chart ships read-only defaults safe for the
# infrabot-style observation use case; override for agents that need to
# mutate the cluster. Set `create: false` to suppress the ClusterRole +
# ClusterRoleBindings when an external system manages them.
rbac:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["pods", "services", "configmaps", "events", "namespaces", "nodes"]
      verbs: ["get", "list", "watch"]
    - apiGroups: [""]
      resources: ["pods/log"]
      verbs: ["get", "list"]
    - apiGroups: ["apps"]
      resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["helm.toolkit.fluxcd.io"]
      resources: ["helmreleases"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["kustomize.toolkit.fluxcd.io"]
      resources: ["kustomizations"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["source.toolkit.fluxcd.io"]
      resources: ["gitrepositories", "helmrepositories", "ocirepositories"]
      verbs: ["get", "list", "watch"]

nodeSelector: {}
tolerations: []
affinity: {}

# Optional user-supplied shell command at the end of the init container's
# setup.sh (e.g. dotfiles installer). Best-effort; failure logs a warning.
setup:
  command: ""

# Claude auth self-healing tunnel (ttyd-driven browser terminal).
reauth:
  tunnel:
    enabled: true
    hostSuffix: ".lab.sherodtaylor.dev"
    tlsSecretName: "lab-wildcard-tls"

# Quiet hours / DND. When set, the agent treats the window as an implicit
# /dnd on for its duration: replies suppressed (or routed through
# edit_message if the matrix-channel fork is loaded), with a single rollup
# reply at window-end. See agents/_shared/CLAUDE.md "Quiet hours / DND /
# vacation mode" for the full behavior.
quietHours:
  window: ""             # e.g. "22:00-08:00"; empty = no schedule
  tz: "America/New_York" # IANA timezone the window is interpreted in

extraEnv: []
# - name: FOO
#   value: bar

# ─────────────────────────────────────────────────────────────────────────────
# Agent Substrate actor mode (opt-in per persona; disabled by default)
# ─────────────────────────────────────────────────────────────────────────────
# When `actor.enabled: true` at fleet level AND `agents[].runtime: actor` on
# a specific persona, that persona renders as a substrate WorkerPool +
# ActorTemplate pair instead of a StatefulSet. Personas without `runtime:
# actor` continue to render as StatefulSets — the two modes coexist. When
# `actor.enabled` is false (default) the actor.* block is entirely ignored.
#
# Requires K8s ≥ v1.36 with feature gates ClusterTrustBundle,
# ClusterTrustBundleProjection, PodCertificateRequest + runtime-config
# certificates.k8s.io/v1beta1=true. Substrate itself is a prereq — install
# via upstream `install-ate.sh` before enabling actor mode. See:
#   docs/superpowers/specs/2026-07-29-agent-substrate-actor-mode-design.md
actor:
  enabled: false

  # Substrate worker pool sizing. One pool per release; personas in actor
  # mode share it. Replicas < persona-count is the whole point (multiplex).
  workerPool:
    replicas: 2
    sandboxClass: gvisor            # gvisor (default) | microvm
    ateomImage: ko://github.com/agent-substrate/substrate/cmd/ateom-gvisor
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { memory: 2Gi }
    nodeSelector: {}
    tolerations: []

  # Snapshot storage. S3-compatible endpoints work with `usePathStyle: true`
  # (rustfs, MinIO, SeaweedFS). AWS S3 and GCS use the native SDK path.
  snapshotStore:
    backend: s3                     # s3 | gcs
    endpoint: rustfs.ate-system.svc.cluster.local:9000
    bucket: agent-smith
    usePathStyle: true
    region: us-east-1                 # S3 clients require one; self-hosted stores ignore it
    # Secret (ExternalSecret or manual) holding AWS_ACCESS_KEY_ID +
    # AWS_SECRET_ACCESS_KEY under those exact keys, in the ate-system
    # namespace where atelet consumes them. Leave empty only for an
    # unauthenticated dev store — snapshots contain checkpointed agent
    # memory, so a real store must require auth.
    credentialsSecret: ""

  # Cluster-scoped default SandboxConfig for the WorkerPool's sandboxClass.
  # ate-controller refuses ResumeGoldenActor without one ("no default
  # SandboxConfig for class \"gvisor\"; set one with spec.default=true or
  # name one via WorkerPool.spec.sandboxConfigName"). Vendored from upstream
  # manifests/ate-install/sandboxconfig-gvisor.yaml @ 66310bb2. Only emitted
  # in helm-native install mode; bring-your-own installs supply their own.
  # atelet fetches the full gVisor release tarball ("gvisor" asset,
  # gvisor.tar.bz2) instead of the bare "runsc" binary.
  sandboxConfig:
    enabled: true
    name: gvisor-default
    default: true
    # Root sandbox container image — holds the sandbox's namespaces, runs no
    # workload code. Required by the SandboxConfig CRD and CEL-validated to be
    # digest-pinned ("@"), because it is captured in the snapshot manifest and
    # a restore re-creates the sandbox from the same image. Off-GCP default
    # below; on GCP prefer the in-project mirror
    # gcr.io/gke-release/pause@sha256:bcbd57ba5653580ec647b16d8163cdd1112df3609129b01f912a8032e48265da
    pauseImage: "registry.k8s.io/pause:3.10.2@sha256:f548e0e8e3dc1896ca956272154dde3314e8cc4fde0a57577ee9fa1c63f5baf4"
    assets:
      amd64:
        gvisor:
          url: "gs://gvisor/releases/release/20260803/x86_64/gvisor.tar.bz2"
          sha256: "9e7a5fcc2cbd28c9cd4af910a9327abcf07a8efcce242c285b860d79010c2db5"
      arm64:
        gvisor:
          url: "gs://gvisor/releases/release/20260803/aarch64/gvisor.tar.bz2"
          sha256: "294d54dea2a18bcd2614a4b5072d6f32f0e8938f9e6e71c9e86b843c4a7b707b"

  # HTTP readiness probe on the harness container. When set, substrate's
  # 20 s golden-snapshot warm-up is skipped — resume returns 200 first try
  # because the TCP listener is in checkpointed RAM.
  readyz:
    enabled: false
    path: /readyz
    port: 8081

  # Per-agent env for actor-mode personas, keyed by agent name. Values render
  # as plain env literals on the ActorTemplate agent container — no
  # secretKeyRef, no envFrom (the CRD doesn't support either, and upstream
  # secretKeyRef delivery waits on agent-substrate/substrate#835). Populate
  # via Flux `valuesFrom` with a `targetPath` per key so real credentials
  # come from a Kubernetes Secret at deploy time and never appear in the
  # chart values:
  #
  #   valuesFrom:
  #     - kind: Secret
  #       name: brandbot-secrets
  #       valuesKey: MATRIX_ACCESS_TOKEN
  #       targetPath: actor.agentEnv.brandbot.MATRIX_ACCESS_TOKEN
  #
  # Typical keys: MATRIX_ACCESS_TOKEN, optionally ANTHROPIC_API_KEY (skip
  # when the persona uses the Claude OAuth home-dir path baked into the
  # golden). Do NOT wire the deployment-mode iron-proxy stubs
  # (GITHUB_TOKEN=proxy-token-github, NODE_EXTRA_CA_CERTS=/root/iron-proxy.crt)
  # — actor egress bypasses iron-proxy (nftables → atunnel → atenet-egress),
  # so the stubs would reach the real endpoint unswapped and 401. Real
  # GitHub access from actor mode is deferred until the HTTPS_PROXY
  # convergence path lands.
  agentEnv: {}
  # agentEnv:
  #   brandbot:
  #     MATRIX_ACCESS_TOKEN: ""   # filled by valuesFrom targetPath
  #     ANTHROPIC_API_KEY: ""     # optional; omit if using OAuth home dir

  # Substrate install shape — D-spike comparison (see
  # docs/superpowers/specs/2026-07-30-d{1,2,3}-*-spike.md).
  #   bring-your-own — chart assumes substrate is already present (default;
  #                    matches tech-spec #117 Path B).
  #   job            — chart deploys a one-shot Job that kubectl-applies
  #                    vendored substrate manifests (D2 spike).
  #   helm-native    — chart directly owns substrate resources via Helm
  #                    templates (D3 spike, this file's mode). Enables
  #                    `helm rollback` to roll substrate back too.
  installMode: bring-your-own

  # Substrate image tag pushed by our CI (docker.yml `substrate` job) to
  # ghcr.io/sherodtaylor/substrate/<binary>. Bump when substrate SHA bumps.
  # Only consumed when installMode != bring-your-own.
  substrateImageTag: sha-66310bb2

  # Git repo the substrate source is cloned from (crypto-bootstrap Job)
  # and built from (docker.yml). Currently a downstream fork: upstream
  # 4b12ce67 + the agent-substrate/substrate#818 suspend-race fix and the
  # evicted-worker reap (u10-fix-rebased branch). Revert to
  # https://github.com/agent-substrate/substrate once both land upstream.
  substrateRepo: https://github.com/sherodtaylor/substrate

  # Full substrate SHA the images above were built at. Used by the D3
  # crypto-bootstrap Job (installMode: helm-native) to check out the right
  # substrate source when it builds kubectl-ate from source. Should track
  # substrateImageTag — the "sha-<8char>" prefix here is the first 8 chars
  # of this full SHA. Must exist in substrateRepo.
  substrateFullSHA: "66310bb2a9e202d1fc9545f1ec700e6c5a8cc738"

  # OTLP exporter endpoint written into the vendored ate-otel-config
  # ConfigMap (consumed via envFrom by all four substrate control-plane
  # components). Empty keeps upstream's default (the GKE-managed collector
  # address); point it at your own collector to receive substrate traces.
  otelExporterEndpoint: ""

  # NodeSelector for the D3 crypto-bootstrap Job. The Job image
  # (golang:1.25-bookworm + apt install + go install kubectl-ate) is heavy
  # enough to trigger DiskPressure eviction on constrained nodes. Default
  # pins to `k3s-server` — override for non-k3s clusters. Set to {} to
  # remove the constraint (only safe once the follow-up pre-built
  # bootstrap image lands).
  bootstrapNodeSelector:
    kubernetes.io/hostname: k3s-server
