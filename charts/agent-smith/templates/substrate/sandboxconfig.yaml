{{- /*
Cluster-scoped default SandboxConfig for the WorkerPool's sandboxClass.

Without this, ate-controller refuses ResumeGoldenActor:
  "no default SandboxConfig for class \"gvisor\"; set one with
   spec.default=true or name one via WorkerPool.spec.sandboxConfigName"

Vendored from upstream manifests/ate-install/sandboxconfig-gvisor.yaml at
pinned SHA 66310bb2. atelet now fetches the gVisor release tarball
(gvisor.tar.bz2: runsc plus the gvisor-bin/ helpers runsc requires next to
it) and extracts it locally; the legacy bare-binary "runsc" asset is still
accepted. The gs:// URLs are gvisor's public release bucket —
downstream egress control must allow storage.googleapis.com for the nodes'
atelet (iron-proxy allowlist in the reference deployment).

Emitted only in helm-native install mode: bring-your-own and job installs
are expected to ship their own SandboxConfig alongside substrate itself.
*/ -}}
{{- if and (default false .Values.actor.enabled) (eq (default "bring-your-own" .Values.actor.installMode) "helm-native") (default true .Values.actor.sandboxConfig.enabled) }}
---
apiVersion: ate.dev/v1alpha1
kind: SandboxConfig
metadata:
  name: {{ .Values.actor.sandboxConfig.name | quote }}
  labels:
    {{- include "agent-smith.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox-config
spec:
  sandboxClass: {{ .Values.actor.workerPool.sandboxClass | quote }}
  default: {{ .Values.actor.sandboxConfig.default }}
  # Required by the CRD as of 4b12ce67, and CEL-validated to contain "@" —
  # the image is recorded in the snapshot manifest, so an unpinned tag would
  # let a re-pull invalidate existing snapshots.
  pauseImage: {{ required "actor.sandboxConfig.pauseImage is required (must be digest-pinned)" .Values.actor.sandboxConfig.pauseImage | quote }}
  assets:
    {{- toYaml .Values.actor.sandboxConfig.assets | nindent 4 }}
{{- end }}
