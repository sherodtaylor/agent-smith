# NOTE: Upstream ate-controller.yaml declares the ate-system Namespace at the
# top of the file. Removed here because our chart owns the Namespace via
# templates/substrate/namespace.yaml (Helm ownership labels + Release
# instance annotation). See spike doc for details.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: ate-client
  namespace: ate-system
  labels:
    apps: ate-client

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ate-controller
  namespace: ate-system
  labels:
    apps: ate-controller

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ate-controller
rules:
- apiGroups: ["ate.dev"]
  resources: ["workerpools", "actortemplates", "sandboxconfigs"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: ["ate.dev"]
  resources: ["workerpools/status", "actortemplates/status"]
  verbs: ["update", "patch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["pods", "services", "configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["events.k8s.io"]
  resources: ["events"]
  verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ate-controller
subjects:
- kind: ServiceAccount
  name: ate-controller
  namespace: ate-system
roleRef:
  kind: ClusterRole
  name: ate-controller
  apiGroup: rbac.authorization.k8s.io
---
# EndpointSlice reads in ate-system, needed by the gRPC `k8s:///` resolver
# that atenet-router now uses to reach ateapi. Upstream ships the Role in
# manifests/ate-install/generated/role.yaml and the RoleBinding in
# ate-controller.yaml; the chart inlines RBAC per component, so both live here.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ate-controller
  namespace: ate-system
rules:
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ate-controller
  namespace: ate-system
subjects:
- kind: ServiceAccount
  name: ate-controller
  namespace: ate-system
roleRef:
  kind: Role
  name: ate-controller
  apiGroup: rbac.authorization.k8s.io

---

kind: Service
apiVersion: v1
metadata:
  name: ate-controller
  namespace: ate-system
  labels:
    app: ate-controller
spec:
  selector:
    app: ate-controller
  ports:
  - name: metrics
    port: 8080
    targetPort: metrics
    protocol: TCP

---

kind: Deployment
apiVersion: apps/v1
metadata:
  name: ate-controller
  namespace: ate-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ate-controller
  template:
    metadata:
      labels:
        app: ate-controller
    spec:
      serviceAccountName: ate-controller
      containers:
      - name: ate-controller
        image: "ghcr.io/sherodtaylor/substrate/atecontroller:{{ .Values.actor.substrateImageTag }}"
        args:
        - --ateapi-ca-file=/run/servicedns-ca/trust-bundle.pem
        - --ateapi-client-cert=/run/podidentity.podcert.ate.dev/credential-bundle.pem
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),k8s.pod.uid=$(POD_UID),service.instance.id=$(POD_UID)
        # OTLP exporter settings are shared by every control plane component;
        # see manifests/ate-install/ate-otel-config.yaml. The controller also
        # propagates these to the ateom worker pods it creates.
        envFrom:
        - configMapRef:
            name: ate-otel-config
        ports:
        - name: metrics
          containerPort: 8080
          protocol: TCP
        - name: healthz
          containerPort: 8081
          protocol: TCP
        volumeMounts:
        # Controller's own client identity presented to ateapi.
        - name: "podidentity"
          mountPath: "/run/podidentity.podcert.ate.dev"
        # Trust bundle used to verify ateapi's servicedns serving cert.
        - name: "servicedns-ca"
          mountPath: "/run/servicedns-ca"
      volumes:
      - name: "podidentity"
        projected:
          sources:
          - podCertificate:
              signerName: podidentity.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
      - name: "servicedns-ca"
        projected:
          sources:
          - clusterTrustBundle:
              signerName: servicedns.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
{{- end }}
