# NOTE: Vendored from upstream manifests/ate-install/ate-otel-config.yaml at
# pinned SHA 231a9ef1 (verified unchanged at 66310bb2). Single source of truth for the OTLP exporter settings
# shared by every control plane component (ate-api-server, ate-controller,
# atelet, atenet-router), which consume it via `envFrom`. ate-controller
# additionally propagates these values to the ateom worker pods it creates,
# and atenet-router's --otlp-collector-address defaults to the endpoint
# below, so Envoy's own spans follow it too.
#
# Chart-specific: the endpoint is overridable via
# .Values.actor.otelExporterEndpoint (upstream hardcodes the GKE-managed
# collector address, which we keep as the default for parity).
#
# NOTE: editing this ConfigMap does not restart the pods that consume it — the
# pod template is unchanged, so no new rollout is triggered. Follow a change
# with `kubectl rollout restart` on the affected workloads.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ate-otel-config
  namespace: ate-system
data:
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.actor.otelExporterEndpoint | default "http://opentelemetry-collector.gke-managed-otel.svc.cluster.local:4317" | quote }}
{{- end }}
