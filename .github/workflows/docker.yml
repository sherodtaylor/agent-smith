name: Build and push image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # push to main  -> :main, :sha-<short>
      # tag vX.Y.Z    -> :vX.Y.Z, :vX.Y, :vX, :latest
      # :latest only moves on a vX.Y.Z release, never on main.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/sherodtaylor/agent-smith
          tags: |
            type=ref,event=branch,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=agent-smith
            org.opencontainers.image.description=Chat-driven Claude Code engineering teammates for a self-hosted homelab
            org.opencontainers.image.source=https://github.com/sherodtaylor/agent-smith
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  substrate:
    # Build + publish agent-substrate binaries as OCI images to
    # ghcr.io/sherodtaylor/substrate/<binary>. Consumed by chart-side
    # actor-mode install paths (D2/D3 spikes) so operators don't need
    # to build substrate themselves. Substrate publishes zero prebuilt
    # images upstream (verified 2026-07-30), so this is where they come
    # from for anyone consuming our chart.
    #
    # Pins to SUBSTRATE_SHA — bump by editing the env var + re-running
    # the workflow. Same GITHUB_TOKEN handles the push; no extra secret.
    #
    # SUBSTRATE_REPO currently points at our downstream fork: upstream
    # 231a9ef1 + the agent-substrate/substrate#818 suspend-race fix
    # (u10-fix branch). Revert to agent-substrate/substrate once #818
    # is fixed upstream.
    name: Build + push substrate images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      SUBSTRATE_REPO: sherodtaylor/substrate
      SUBSTRATE_SHA: b65e2663644513a410e04af5f31a313c9caaa9f4
      KO_DOCKER_REPO: ghcr.io/sherodtaylor/substrate
    steps:
      - name: Checkout substrate at pinned SHA
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SUBSTRATE_REPO }}
          ref: ${{ env.SUBSTRATE_SHA }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up ko
        uses: ko-build/setup-ko@v0.9
        with:
          version: v0.18.0

      - name: Log in to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | ko login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish substrate images
        run: |
          set -euo pipefail
          SHORT_SHA="${SUBSTRATE_SHA:0:8}"
          # ko's `--bare` flag publishes to $KO_DOCKER_REPO exactly, without
          # appending the import path — needed here because ko's default
          # namespacing would fold in the full github.com/agent-substrate/...
          # path. Setting KO_DOCKER_REPO per-binary keeps each image in its
          # own repo (ghcr.io/sherodtaylor/substrate/<binary>) so the 6
          # builds don't overwrite each other at a single path.
          for cmd in ateapi atelet atecontroller atenet ateom-gvisor podcertcontroller; do
            echo ">>> publishing substrate/${cmd}"
            KO_DOCKER_REPO="ghcr.io/sherodtaylor/substrate/${cmd}" \
            ko publish --bare \
              --tags "sha-${SHORT_SHA}" \
              --tags "latest" \
              "./cmd/${cmd}"
          done

  chart:
    name: Package + publish Helm chart
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Derive chart version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Lint chart
        run: |
          helm lint charts/agent-smith \
            --set agentName=ci \
            --set matrix.homeserverUrl=https://x \
            --set matrix.botUserId=@y:x \
            --set existingSecret=z

      - name: Package chart
        run: |
          mkdir -p dist
          helm package charts/agent-smith \
            --version "${{ steps.version.outputs.version }}" \
            --app-version "${{ steps.version.outputs.version }}" \
            --destination dist/

      - name: Log in to GHCR for Helm
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push chart to GHCR OCI
        run: |
          helm push "dist/agent-smith-${{ steps.version.outputs.version }}.tgz" \
            oci://ghcr.io/sherodtaylor/charts

      - name: Attach chart to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/agent-smith-*.tgz
          fail_on_unmatched_files: true
